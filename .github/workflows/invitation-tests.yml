name: Invitation tests

on:
  push:
  pull_request:

jobs:
  repeat-suppression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s tests -p 'test_star_invitation.py'
